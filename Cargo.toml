[workspace]
resolver = "2"
members = [
    "crates/vilan-core",
    "crates/vilan-cli",
    "crates/vilan-lsp",
    "crates/vilan-ide",
    "crates/vilan-embedded-std",
    "crates/vilan-wasm",
]

# The clippy gate's exception list (backlog N21). `cargo clippy --workspace
# --all-targets -- -D warnings` is a CI leg, so every finding is an error and an
# exception has to be WRITTEN DOWN — which is the point of collecting them here
# rather than scattering `#[allow]`s. Each entry is a decision about the SHAPE OF
# THIS CODEBASE, one no individual site could answer differently; a lint whose
# verdict is a per-site judgment stays live and gets its allow at the site, with
# its reason (`platform_color.rs`'s borrow-ending copy, `interpreter.rs`'s
# `to_js_string` receiver, `tests/support/boot.rs`'s try_wait loop are the three
# today). `#![allow(clippy::all)]` is deliberately not what this is.
#
# Each crate opts in with `[lints] workspace = true`, which covers its every
# target — lib, bin, tests, build script.
[workspace.lints.clippy]
# The compiler threads explicit context through its entry points instead of
# bundling it into a parameter struct: a `&mut Analyzer` plus the ids, spans and
# substitution maps one step needs, passed on. The tree carried 22 per-site
# allows for this one threshold before this line existed, across the analyzer,
# the macro world, async inference and bindgen — that is a decision about the
# codebase, not 22 decisions, and a parameter struct assembled per call would
# hide which of its fields a callee actually reads.
too_many_arguments = "allow"
# Return tuples and callback types in the compiler ARE the shape of the data:
# `(Type, Vec<(TypeId, TypeId)>)` says what reconciliation yields, where a named
# alias would say `Reconciled` and send every reader to its definition. The lint
# asks for indirection at exactly the sites where the shape is the documentation.
# Two per-site allows for it are deleted with the 22 above.
type_complexity = "allow"
# The recursive walkers over patterns, types and values are METHODS because they
# belong beside their siblings on `Analyzer` / `Interpreter`, and a leaf case
# that happens not to touch `self` does not change where the code lives. Taking
# the lint's advice would move a handful of arms out to free functions and split
# one walk across two namespaces.
only_used_in_recursion = "allow"
# `Node`, the parser's type forms and the formatter's layout enum are hot AST
# enums matched in the innermost loops of every phase. Boxing the large variant
# to even the sizes trades a memcpy the profiler never showed for a pointer chase
# on every match — a performance decision, made in the other direction, that the
# lint is not in a position to make.
large_enum_variant = "allow"

# Distributed binaries carry no symbol tables (smaller, and fewer places for
# build-machine paths to hide — release CI also remaps, and checks).
[profile.release]
strip = true

# Release performance with debug symbols, for profilers (perf, callgrind):
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# The wasm artifact is downloaded before the playground can do anything, so it
# is tuned for SIZE where the native binaries are tuned for speed — hence a
# separate profile rather than flags on `release`, which would shrink and slow
# the shipped compiler for everyone. `cargo build --profile wasm-release
# --target wasm32-unknown-unknown -p vilan-wasm`.
#
# Deliberately NOT `panic = "abort"`, though it would shave more: core fences
# its analysis in `catch_unwind` so a compiler panic degrades to one honest
# diagnostic, and aborting would trade that for a dead instance. (Whether the
# fence actually catches on wasm32 depends on the target's unwinding support —
# if it does not, the page's instance-recycle path is what covers it, which is
# why that path exists rather than being an optimization.)
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
