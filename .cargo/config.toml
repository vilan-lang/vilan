# The test threads' stack. libtest runs every #[test] on a 2 MiB thread, and
# the analyzer's expression walk (`walk_expr_node_inner`, one frame per level
# of nesting) overflowed that on Windows at nine levels — a module-cycle pin,
# `b250_a_declared_leg_with_no_manifest_is_unchanged`, aborted the Windows
# shard at Order 36's seal (0xc00000fd) while Linux passed at 2 MiB and
# failed at 1 MiB. The binaries are unaffected: `vilan` runs the compiler on a
# COMPILER_STACK_SIZE thread (128 MiB) and the language server on 128–256 MiB
# threads. cargo and nextest both hand this table to the test processes, so
# the suite runs on 8 MiB threads everywhere, CI included. A value written by
# the shell still wins (no `force`).
[env]
RUST_MIN_STACK = "8388608"
# N137: every test process — and every `vilan` a test spawns — keeps its
# `vilan check` macro-expansion tables under `target/`, not in the developer's
# `~/.vilan/check-cache`: the suite checks thousands of temp packages, each a
# table keyed by its path, and they had grown that root to 19,000 directories.
# A `cargo run` of the CLI from this workspace lands there too; an installed
# `vilan` never reads this file.
VILAN_CHECK_CACHE = { value = "target/test-check-cache", relative = true }
# std-prefix P3: no test process — and no `vilan` a test spawns — reads or
# writes the persisted std prefix under `~/.vilan/cache/worlds` (the CLI and the
# language server set that default for themselves). The pins that exercise the
# file point `VILAN_WORLD_CACHE` at a scratch directory of their own. The shell
# still wins (no `force`).
VILAN_WORLD_CACHE = "off"
# std-prefix P5 (N157, Order 54): the SUITE's world cache. The file is read only
# by an analysis built over the std prefix, which no test process is by default
# — so the binaries that gain from it opt in and point their world cache here
# (`inference`: `tests/inference/support.rs`; `docs`: `tests/docs.rs`; both
# all single-file programs, the shape in which the prefix and the canonical
# path are one layout), while every other process keeps
# the `off` above: the differentials' forced-prefix legs measure the in-process
# prefix, and a file another test process wrote must not decide what they
# observe. The key names the analyzer's build, so every rebuild of vilan-core
# writes new files beside the old; P4's byte bound (256 MiB) holds the
# directory, least recently used first.
VILAN_TEST_WORLD_CACHE = { value = "target/world-cache", relative = true }
