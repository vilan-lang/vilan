# The ignored pins, weekly and NON-BLOCKING (backlog N27).
#
# CLAUDE.md's rule is "a known-but-unfixed bug is pinned as an `#[ignore]`d test
# and un-ignored when fixed". Nothing enforced the second half: ci.yml's legs
# carry no `--run-ignored`, so a pin whose bug was fixed in passing kept its
# `#[ignore]` forever and only a manual audit could notice. This leg is that
# backstop.
#
# **It is a REPORT, not a gate, and it must stay one.** The bug pins in the
# ignored set are expected RED — they reproduce symptoms nobody has fixed yet,
# which is what they are for — so a blocking leg here would be red by design.
# The signal is the opposite: a pin that now PASSES, meaning its `#[ignore]`
# reason has expired and the pin should be un-ignored (or, if the bug is really
# still there, the pin no longer reproduces it and is worthless as written).
# Hence `continue-on-error: true` on the job, and hence this workflow is NOT in
# `ci / check`'s `needs` — it is a different workflow entirely, so it cannot
# strand a PR at "Expected — waiting for status to be reported".
#
# Not every green here is a finding, and the report says so rather than crying
# wolf: `perf_baseline_full_run` is ignored for its COST, not for a bug, so it
# passes every week and its reason cannot expire. That is why the step reports
# and warns instead of failing on a passing pin — a leg that went red every
# Monday would be read as broken inside a month.
#
# Every `uses:` is pinned to a full commit SHA with its tag in the comment
# (L14), the same pins ci.yml carries; `.github/dependabot.yml` moves them.
name: ignored-pins

on:
  schedule:
    # Mondays, 05:23 UTC. Off the hour on purpose: GitHub delays cron jobs
    # scheduled at popular round times.
    - cron: "23 5 * * 1"
  # So the report can be produced on demand — after a fix round, say, without
  # waiting for Monday.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ignored-pins:
    runs-on: ubuntu-latest
    # The whole job is advisory: a red one never blocks anything, and nothing
    # requires it.
    continue-on-error: true
    # The ignored set includes `perf_baseline_full_run`, which is minutes of
    # measurement. Finite so a hung pin cannot burn a runner all day.
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Many tests shell out to `node`; same version ci.yml pins.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-nextest

      - name: Run the ignored pins
        # `--run-ignored only` is nextest's spelling for libtest's
        # `--ignored` (`ignored-only` is its deprecated alias — do not
        # reintroduce it). The one exclusion is
        # `perf_baseline_lsp_edit_latency`: 247 s of measurement whose
        # `#[ignore]` reason is cost and cannot expire, so it buys this leg
        # nothing for a quarter of its budget.
        #
        # The command's own exit code is DISCARDED here — red pins are the
        # expected outcome and the report below is what this job produces. The
        # log is the report's only input, and `--color never` keeps it free of
        # escape sequences the parser would have to strip.
        run: |
          set -u
          cargo nextest run --workspace \
            --run-ignored only \
            --color never \
            --status-level pass \
            -E 'not test(perf_baseline_lsp_edit_latency)' \
            > pins.log 2>&1 || true
          cat pins.log

      - name: Report any pin that now passes
        # Parses nextest's per-test lines, which look like
        #
        #     PASS [   0.044s] (1/3) vilan-cli::debug_dumps some_test_name
        #     FAIL [   0.291s] (2/3) vilan-core::inference other::test_name
        #
        # and writes the job summary. Exits 0 whatever it finds: see the header
        # — a passing pin is a warning to a human, not a broken build.
        run: |
          set -u

          extract() {
              sed -n "s/^ *$1 \[[^]]*\] \(([0-9]*\/[0-9]*) \)\?\(.*\)$/\2/p" pins.log
          }
          PASSED=$(extract PASS)
          FAILED=$(extract FAIL)
          PASSED_COUNT=$(printf '%s' "$PASSED" | grep -c . || true)
          FAILED_COUNT=$(printf '%s' "$FAILED" | grep -c . || true)

          {
              echo "## The ignored pins"
              echo
              echo "\`cargo nextest run --workspace --run-ignored only\`, less"
              echo "\`perf_baseline_lsp_edit_latency\`. **$PASSED_COUNT passed, $FAILED_COUNT failed.**"
              echo
              if [ "$PASSED_COUNT" -gt 0 ]; then
                  echo "### Passed — re-read each one's \`#[ignore]\` reason"
                  echo
                  echo "A pin that passes has either had its bug fixed (un-ignore it) or stopped"
                  echo "reproducing the bug it names (rewrite it). The exception is a pin ignored"
                  echo "for its COST rather than for a bug — \`perf_baseline_full_run\` — whose"
                  echo "reason cannot expire and which passes here every week."
                  echo
                  printf '%s\n' "$PASSED" | sed 's/^/- `/; s/$/`/'
                  echo
              fi
              if [ "$FAILED_COUNT" -gt 0 ]; then
                  echo "### Failed — the expected outcome for a bug pin"
                  echo
                  printf '%s\n' "$FAILED" | sed 's/^/- `/; s/$/`/'
                  echo
              fi
              if [ "$PASSED_COUNT" -eq 0 ] && [ "$FAILED_COUNT" -eq 0 ]; then
                  echo "**No pin ran at all** — the ignored set is empty, or the run did not get"
                  echo "as far as running tests. Check the step log above; this leg has no finding."
                  echo
              fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PASSED_COUNT" -gt 0 ]; then
              printf '%s\n' "$PASSED" | while IFS= read -r pin; do
                  [ -n "$pin" ] && echo "::warning::the ignored pin '$pin' now PASSES — re-read its #[ignore] reason"
              done
          fi
          if [ "$PASSED_COUNT" -eq 0 ] && [ "$FAILED_COUNT" -eq 0 ]; then
              echo "::warning::no ignored pin ran — this report has no finding"
          fi
