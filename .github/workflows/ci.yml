# PR CI (proposal/windows-support.md §8, slice S0). Before this file existed
# the suite ran exactly once per release — at tag push, on ubuntu only
# (release.yml's `gate` job). This runs it on every PR and every push to
# `next`/`main`, on ubuntu **and** windows.
name: ci

# NOTE the shape here, and do not put `paths-ignore` back (process.md §2.5,
# §8.2). This workflow used to carry `paths-ignore` on both triggers, listing
# the root prose files. A PR touching only those produced **no workflow run at
# all** — not a skipped job, no run — and a required check that never reports
# strands the PR at "Expected — waiting for status to be reported", forever.
# That file list is close to a description of a first-time contributor's first
# PR, so the first external README typo fix would have been unmergeable.
#
# Moving the filter to the job level does not fix it either while the filter
# sits on `on:`: no trigger means no jobs, so an aggregator inside the workflow
# would not run either. The filter has to move *into* the workflow, which is
# what `changes` below is. The workflow now always triggers; the expensive legs
# decide for themselves whether to run; `check` always reports.
#
# NOTE ALSO where the gate commands are: NOT here. Every leg job below runs
# `scripts/ci-local.sh <leg>` and nothing else, so the local gate and this file
# are ONE list of commands rather than two that agree until they don't (L19).
# The workflow keeps what only a workflow can have — the runner, the toolchain,
# the tool installs, the caches, the matrix — and the script keeps what a
# person can run: `scripts/ci-local.sh` with no arguments is this file's union.
# `crates/vilan-cli/tests/ci_local_script.rs` holds the two together in both
# directions (every leg job calls the script; the script's leg list is the job
# list), and `release_gate.rs` reads the CI side's commands out of the script
# now that this is where they live.
on:
  pull_request:
  push:
    # `release/**`: a §7.3 patch branch (releases.md) is cut from its own head,
    # and `cut-release.sh` refuses to tag a commit CI has not verified (L17).
    # A pull request cannot stand in for that: the patch's release commit
    # retitles `## Unreleased` and bumps every manifest, which conflicts with
    # `next` by construction, and a conflicting pull request gets no run —
    # v0.41.1's cut found this. The branch is pushed, so the push is the gate.
    branches: [next, main, "release/**"]

# The suite needs nothing from the token but the checkout: claim read-only
# explicitly, whatever the repo default is (release.yml already declares its
# own grants). N16 audit, Order 11.
# Every `uses:` below is pinned to a full commit SHA with its tag in the
# comment (L14); `.github/dependabot.yml` keeps the pins moving.
permissions:
  contents: read

# A superseded run on the same ref is cancelled; the newest push is the one
# whose result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds of ubuntu, and it always runs. Deliberately a plain `git diff`
  # rather than a filter action: this repository takes no dependency it can
  # write itself in ten lines, and a third-party action in the path of the
  # required check is a supply-chain surface for no gain.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # TRUSTED: the event's code is this repository's own — a push to a branch
      # here, or a pull request whose head repository is this one (Dependabot's
      # branches included). A fork's PR is not, whoever opened it. Only trusted
      # events may reach the owner's self-hosted runner (the `test` job's
      # `runs-on`): a self-hosted runner executes whatever the workflow's
      # checkout holds, so a fork reaching it would be a fork running code on
      # the owner's machine. The repository setting "require approval for all
      # outside collaborators" is the second lock; this output is the first and
      # does not depend on it.
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - id: trust
        run: echo "trusted=${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The filter diffs against the base commit, so one commit is not
          # enough. Full history is the only depth that is *always* enough (a
          # long-lived branch or a force-push can put the base arbitrarily far
          # back) and it costs seconds on a repository this size.
          fetch-depth: 0
      - id: filter
        env:
          # `pull_request` gives the PR's base; the checked-out ref is the merge
          # commit, so base..HEAD is exactly the PR's net effect. `push` gives
          # the commit the branch pointed at before this push. Read through env
          # rather than interpolated into the script body — these are shas, but
          # the habit is what keeps a workflow un-injectable.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Every uncertain answer is `true`. A filter that wrongly skips the
        # suite is a hole in the gate; a filter that wrongly runs it costs
        # runner minutes. Those are not the same kind of mistake.
        run: |
          set -eu

          if [ -z "${BASE_SHA:-}" ] \
              || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "::notice::no usable base commit ('${BASE_SHA:-}') — running the suite"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed since $BASE_SHA:"
          echo "$CHANGED"

          # Root prose never turns the suite red, so it does not buy a windows
          # leg. vilan/docs/** is deliberately NOT in this set: docs fences are
          # compiled by the docs gate. (vilan/proposal/ is a one-file banner
          # since the N15 move to vilan-lang/proposals; records pushes no
          # longer happen in this repo at all.) Anything not listed here is code.
          PROSE='^(README\.md|AI_STANCE\.md|AGENTS\.md|CLAUDE\.md|CODE_OF_CONDUCT\.md|LICENSE-APACHE|LICENSE-MIT|\.gitignore)$'

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qvE "$PROSE"; then
              echo "::notice::a non-prose path changed — the suite runs"
              echo "code=true" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::root prose only — the suite is skipped, and \`check\` still reports"
              echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Both legs always run: the windows result is the deliverable here, so a
      # red ubuntu leg must not cancel it.
      fail-fast: false
      # The suite's wall clock on a GitHub runner is COLD COMPILE, not test
      # time (L19). Two levers, and they fix different halves. The CACHE below
      # removes the compile on the runs that get a hit; the SHARD splits what
      # is left, because a warm compile still leaves the suite itself serial
      # on one runner. Each shard pays its own cache restore and its own link,
      # so the split stops buying long before the parallelism does: ubuntu
      # stays at two. Windows is FOUR (2026-10-05, the owner): by Order 47 the
      # suite had grown to 9,800 tests and the windows shards ran 50 and 66
      # minutes against ubuntu's 32 and 54, the long pole of a 67-minute run;
      # the windows runner is the slower machine and the one whose result is
      # the deliverable here, so it takes the extra restores.
      matrix:
        include:
          - { os: ubuntu-latest, partition: 1, shards: 2 }
          - { os: ubuntu-latest, partition: 2, shards: 2 }
          - { os: windows-latest, partition: 1, shards: 4 }
          - { os: windows-latest, partition: 2, shards: 4 }
          - { os: windows-latest, partition: 3, shards: 4 }
          - { os: windows-latest, partition: 4, shards: 4 }
    # The ubuntu legs of a TRUSTED event run on the owner's self-hosted runner
    # (label `vilan-linux`; proposals/scripts/integration/runner/), where the
    # suite takes minutes instead of the better part of an hour. Everything
    # else — a fork's PR, and the windows legs until a windows runner exists —
    # stays on GitHub's machines.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && needs.changes.outputs.trusted == 'true') && 'vilan-linux' || matrix.os }}
    # The suite proves the tree against CURRENT stable, not against the pin in
    # rust-toolchain.toml — that file is the formatter's pin (backlog N21; the
    # `fmt` job below is what follows it). Explicit because it would not hold
    # by itself: dtolnay/rust-toolchain only runs `rustup default`, and a
    # committed toolchain file outranks the default, so without this line the
    # file would quietly repin every cargo invocation in this job.
    env:
      RUSTUP_TOOLCHAIN: stable
    # Both legs are REQUIRED. The windows leg ran allowed-fail while it was
    # the arc's instrument (windows-support.md §8-§9: it settled the
    # include_str `\\?\` build risk and the NTFS case behavior, and produced
    # the failure list the fix rounds worked from); observed fully green
    # 2026-07-25 (run 30136463220), and the allowance was removed per the
    # recorded plan.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Many tests shell out to `node` (the macro/native equivalence gate, every
      # e2e suite). Pinned to the same version release.yml's gate job uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The TextMate grammar's SCOPE pins (tracker E163). They tokenise with
      # `vscode-textmate` over `vscode-oniguruma` — the tokeniser and the regex
      # engine VS Code itself loads — so they answer "which scope does this
      # bracket end up with" rather than "which rule could match this text",
      # which is the question the two E164 defects were invisible to. Nothing
      # else in a checkout creates `editors/vscode/node_modules`, so without
      # this step every scope pin would skip and the grammar would be gated on
      # its own rules' text again. Both packages are devDependencies: the vsix
      # bundles `dependencies` only and `.vscodeignore` drops `node_modules/`,
      # so nothing here reaches a published extension. ~1 s warm, +2 lockfile
      # packages, 0 advisories. `grammar_sync.rs` REFUSES to skip when `CI` is
      # set, which is what makes a dropped step a red suite rather than a
      # quietly thinner gate.
      - name: The VS Code grammar's tokeniser
        shell: bash
        run: npm ci --prefix editors/vscode
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # The suite runs under nextest (E25, proposal/suite-speed.md): every
      # test in its own process, all binaries interleaved instead of serial.
      # fail-fast is off via the committed .config/nextest.toml — this
      # workflow is the instrument that produces the COMPLETE failure list
      # per push (the exit code still gates).
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      # The registry, the git checkouts and `target/`, carried between runs.
      # The key is per-OS by construction — the action folds `runner.os`, the
      # rustc version and the lockfile into it — and `shared-key` makes both
      # shards of one OS read ONE entry rather than two that each hold half a
      # `target/`. `save-if` keeps the WRITERS to the branches PRs are cut from:
      # a PR warms itself off `next`'s entry and does not evict it, which is the
      # difference between a cache and a queue of PRs overwriting each other.
      # GitHub-hosted only: the self-hosted runner's `_work` persists between
      # jobs, so its `target/` is already warm and a cache restore would only
      # overwrite it with an older one.
      #
      # N156: the suite builds under Cargo.toml's `ci-test` profile (vilan-core
      # at opt-level 1; `scripts/ci-local.sh` selects it), so its artifacts are
      # `target/ci-test/`, not `target/debug/`. The key says so: the entry an
      # older run saved under `suite-<os>` holds a `target/debug/` this job no
      # longer reads, and restoring it would only carry dead weight into the new
      # profile's first cache. The action caches every profile directory it finds
      # under `target/`, so nothing else needs to learn the name. Expect ONE cold
      # run (a clean opt-level-1 vilan-core, ~+1.5 min on the shared runners) and
      # warm ones after it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: suite-ci-test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}
      # THE gate command, and it is not written here: `scripts/ci-local.sh`
      # holds it, this job calls the script, and `ci_local_script.rs` holds the
      # two together. release.yml's `gate` job runs the same legs, character
      # for character — see releases.md §7 step 1 for what happened the one
      # time they disagreed, and `release_gate.rs` for the machine behind it.
      # `shell: bash` because the windows leg's default is PowerShell and the
      # script is POSIX shell; the runner ships git-bash for exactly this.
      - name: The suite is green
        shell: bash
        env:
          # nextest's own sharding: `count:N/M` selects a deterministic Mth of
          # the tests, so an OS's shards together are the whole suite and
          # none runs a test twice.
          VILAN_CI_PARTITION: ${{ matrix.partition }}/${{ matrix.shards }}
        run: scripts/ci-local.sh test
      # nextest does not run doc-tests. Every doc-test set is empty today;
      # this leg exists so a future doc-test cannot silently stop running.
      # ONCE per OS: the shards split the SUITE, not this, and a doc-test run
      # on both shards is a doc-test run twice.
      - name: The doc-tests are green
        if: matrix.partition == 1
        shell: bash
        run: scripts/ci-local.sh doctest

  # The playground's compiler (D11). Its BEHAVIOUR is covered by the workspace
  # suite above — `vilan-wasm` is an rlib as well as a cdylib precisely so its
  # compile logic is tested natively, and the wasm-bindgen layer is a type
  # conversion with no decisions in it. So this leg exists to prove one thing
  # the host tests cannot: that the crate still REACHES wasm32 at all. A `std`
  # dependency that quietly stops compiling for the target would otherwise
  # surface at release time, or on the site.
  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Same declaration as `test`, and here it is load-bearing twice over: the
    # wasm32 target is installed for the toolchain the ACTION names, so letting
    # rust-toolchain.toml resolve the build to its pinned channel would fail on
    # a missing target — at build time, on a tree nobody broke.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      # This job's three minutes are a cold `wasm-release` build and a
      # `cargo install wasm-bindgen-cli`; the cache holds both (the installed
      # binary lands in `~/.cargo/bin`, which the action carries).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}
      # Pinned to the `wasm-bindgen` crate version in vilan-wasm/Cargo.toml.
      # The two must match exactly — a mismatch fails in the browser at
      # runtime, not here, which is the worst place to find out.
      - name: wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      # The leg ends by RUNNING the artifact under node (N134): v0.41.0's
      # compiler built and bound here and trapped on every compile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The build, the bindings and the smoke, from the script. The same 16 MiB stack the
      # playground ships with (release.yml, where the measured B138 rationale
      # for the size lives): the compiler recurses over deep expression trees,
      # and wasm's default stack is far smaller than a host thread's. Binding
      # generation is part of "it builds" — a signature wasm-bindgen cannot
      # express must fail here rather than on the page. The `--out-dir` is
      # `target/wasm-pkg` rather than `pkg` because the script runs in a
      # checkout somebody works in, and `target/` is the one directory this
      # repository already ignores.
      - name: The artifact builds and the bindings generate
        run: scripts/ci-local.sh wasm

  # Formatting is a gate (backlog N21). `cargo fmt` after every Rust change is
  # CLAUDE.md's own rule, and the tree still drifted — four hunks that then
  # cost three separate lanes in one cycle a revert-and-report each. This leg
  # holds the tree to rustfmt's answer, and deliberately carries NO
  # `RUSTUP_TOOLCHAIN`: it resolves through rust-toolchain.toml, whose exact
  # pinned toolchain is what makes that answer byte-stable across rustfmt
  # releases (the runner's preinstalled rustup reads the file and fetches the
  # pinned toolchain, rustfmt included, on first use — no action needed).
  # ubuntu only: formatting is platform-independent text.
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tree is formatted
        run: scripts/ci-local.sh fmt

  # `cargo fmt`'s twin one language down (tracker N55): the tree's `.vl` held to
  # `vilan fmt`'s own answer. It was advisory until this leg — 96 files, seven of
  # them under `vilan/std`, differed from what the compiler in the same commit
  # would have written for them, which made "run the formatter" a suggestion and
  # every later reflow a diff nobody could tell from a change.
  #
  # `RUSTUP_TOOLCHAIN: stable` and a cache of its own, because unlike `fmt` this
  # leg BUILDS something: the answer comes from this commit's compiler, so the
  # gate cannot drift from the formatter the way a pinned rustfmt could.
  # ubuntu only, like its twin: formatting is platform-independent text.
  vilan-fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: vilan-fmt
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}
      - name: The tree's vilan sources are formatted
        run: scripts/ci-local.sh vilan-fmt

  # The second of backlog N21's three legs, and the `fmt` job's twin in every way
  # that matters. `--all-targets` so the tests, the build script and the benches are
  # held to the same bar as the library; `-D warnings` so a finding is a failure
  # rather than a line in a log nobody reads — which is what the rustc warnings
  # this leg also inherits (`dead_code` and friends) had been for releases.
  #
  # NO `RUSTUP_TOOLCHAIN`, deliberately, exactly as `fmt` carries none: this
  # resolves through `rust-toolchain.toml`, which pins `clippy` alongside
  # `rustfmt` for the same reason — the lint set moves every six weeks, and an
  # unpinned gate that denies warnings would go red for a tree nobody edited. The
  # exceptions the tree does claim are collected in one place, the root
  # `Cargo.toml`'s `[workspace.lints.clippy]`, each with its reason; the handful
  # that are per-site judgments carry their reason at the site.
  #
  # ubuntu only: the lints are platform-independent, and the `cfg`-gated windows
  # code they cannot see from here is covered by the windows `test` leg
  # compiling it.
  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Clippy compiles the workspace's every target, so this leg's clock is a
      # build too. Its own `shared-key`: clippy's `target/` holds `.rmeta` where
      # the suite's holds linked test binaries, and one entry serving both would
      # thrash rather than hit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}
      - name: The tree is clippy-clean
        run: scripts/ci-local.sh clippy

  # N21's last leg: the dependency tree against the RustSec advisory
  # database. The one leg here whose answer is not a property of the tree alone —
  # an advisory published against an unchanged `Cargo.lock` turns this red for a
  # commit nobody wrote. That is the OPPOSITE of the `fmt`/`clippy` pin argument
  # and it is why it is wired anyway: a rustfmt default moving is a false alarm,
  # while a vulnerability landing in a dependency of a shipped compiler is a TRUE
  # finding that happens to arrive on someone else's schedule. It feeds `check`
  # like every other leg, so it stops the line, which is the point.
  #
  # Strictness, chosen rather than inherited: a vulnerability fails (cargo-audit's
  # default) and so does an `unsound` advisory, because a memory-safety defect in
  # a crate this compiler links is the same class of problem whatever RustSec
  # calls the row. `unmaintained` and `yanked` stay WARNINGS — they are printed
  # and read, but neither is a defect, and an upstream maintainer stepping away
  # must not block a PR that changed a comment. `--deny warnings` would do that.
  #
  # `RUSTUP_TOOLCHAIN: stable` for the reason the suite legs declare it, arrived
  # at from the other side: the verdict is a property of `Cargo.lock` and the
  # advisory database, not of a compiler, so there is no reason to make this job
  # fetch the formatter's pinned toolchain to shell out to a standalone binary.
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same installer the suite legs use for nextest, same pin.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: No advisory against the dependency tree
        run: scripts/ci-local.sh audit

  # The instruction budgets (M105 S3, `proposal/performance-gates.md` §3, RULED
  # Q1/Q4/Q7). v0.42.0 shipped a 3x CPU regression on the owner's application
  # with every leg above green: nothing gated the aggregate cost. This does,
  # by COUNT rather than by clock — a shared runner is a loaded machine by
  # construction, and wall and CPU time move with load while user-space
  # instructions move by parts per million (§2.2). The subjects are the
  # examples, the seeded kolt-shaped app of `scripts/perf_genapp.py` (so the
  # gate never needs the private repository, §5) and a plain package at two
  # sizes whose RATIO is held to x2.3 per doubling (M107, Q11).
  #
  # The runners expose no hardware counter: every run so far fell back to
  # callgrind's Ir (which is why valgrind is installed), and the measured JSON
  # names the counter it used. M114 read the first fourteen runs: the same
  # code counted the same within 0.01% on four runner CPUs (AMD EPYC
  # 7763/9V74/9V45, Intel Xeon 6973P-C), so the `ci` class's ceilings were
  # adopted from this job's own uploaded counts (`perf_gate.py ratchet --from
  # measured.json --tolerance 0.005`) and now refuse like the reference
  # class's do, at 0.5% (Q7).
  #
  # No `RUSTUP_TOOLCHAIN` and no toolchain action (M126): an instruction count
  # is a property of the BINARY, so a new stable rustc moves every `ci` row
  # by however much its codegen changed, and a tree nobody edited goes red
  # on the Tuesday it ships. This leg resolves through rust-toolchain.toml
  # like `fmt` does: the ceilings are adopted on the pinned toolchain, and a
  # toolchain bump re-adopts them in the same commit.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      VILAN_PERF_CLASS: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Its own cache entry: a RELEASE `target/`, which no other leg builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: perf
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}
      - name: The callgrind fallback, for a runner with no PMU
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: The instruction budgets hold
        run: scripts/ci-local.sh perf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-measured
          path: target/perf-gate/measured.json
          if-no-files-found: ignore

  # **This is the job to make a required status check** (process.md §2.5, where
  # it is called `ci`; the context reads `ci / check`). Everything above it can
  # legitimately not run; this cannot, which is the entire point — a required
  # check that can be skipped is a PR stuck at "Expected" forever.
  #
  # `if: always()` runs it whatever the needed jobs did. The semantics are:
  #
  #   success  -> pass    the leg ran and was green
  #   skipped  -> pass    the leg legitimately did not run (prose-only change,
  #                       or `changes` short-circuited it)
  #   failure  -> FAIL    a real leg went red
  #   cancelled-> FAIL    the result is unknown, and unknown is not green
  #
  # So a docs-only or root-prose-only push takes the cheap path — `changes`
  # runs, `test`, `wasm`, `fmt`, `vilan-fmt`, `clippy`, `audit` and `perf` skip, `check`
  # is green —
  # and any red leg turns `check` red. `changes` is in `needs` on purpose: if
  # the filter itself fails, the expensive legs skip, and without this the
  # aggregate would call that a pass.
  check:
    needs: [changes, test, wasm, fmt, vilan-fmt, clippy, audit, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: What each needed job did
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"
      - name: A needed job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a needed job did not pass — see the results above"
          exit 1
