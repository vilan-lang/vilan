# The release pipeline (proposal/releases.md §7): push a `v*` tag and this
# gates on the full suite + a changelog section, builds every platform with
# build paths remapped away, packages tarballs + the VS Code .vsix + the
# install script, and publishes the GitHub Release with the changelog section
# as its notes. Cutting a release is: bump, changelog, commit, tag, push.
name: release

on:
  push:
    tags: ["v*"]

# The gate runs on the SAME platform matrix as ci.yml (ubuntu + windows,
# backlog L17): a tag can be pushed from a commit no PR ever saw, and a gate
# narrower than CI is how v0.37.0 published with a red Windows leg.
#
# Every `uses:` above is pinned to a full commit SHA with its tag in the
# comment (L14). A mutable tag is a standing grant of code execution to
# whoever can move it, and in THIS workflow that execution holds the release
# token. `.github/dependabot.yml` moves the pins so they stay current rather
# than merely frozen.
permissions:
  contents: write

jobs:
  gate:
    strategy:
      # The same platform matrix as ci.yml's `test`, and it must stay that way
      # (backlog L17). This job ran `ubuntu-latest` only until 2026-08-28,
      # which made the gate authorizing a publish STRICTLY WEAKER than the
      # gate deciding a commit is green — and v0.37.0 was tagged and published
      # on a tree whose Windows CI leg had been red for days. Same two-sided
      # rule as the suite legs below: change this matrix and ci.yml's
      # together. `fail-fast: false` for ci.yml's reason — a red leg blocks
      # every publish job either way (they need the whole matrix), so what
      # letting the other leg finish buys is the complete failure list on the
      # day it matters most.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite runs against current stable, exactly as ci.yml's `test` job
    # declares it: rust-toolchain.toml is the formatter's pin (N21), and it
    # would otherwise outrank the toolchain dtolnay/rust-toolchain sets.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The changelog names this release
        # `shell: bash` for the windows leg, same reason as the build job's:
        # git-bash is preinstalled there, and the default pwsh speaks none of
        # this.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## v$VERSION " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## v$VERSION — <date>' section — write the notes before tagging."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Everything below this line is ci.yml's `test` job, character for
      # character, and it must stay that way (process.md §7.2 and §8.1;
      # releases.md §7 step 1). This step ran plain `cargo test` until
      # 2026-08-07, which made the release gate a WEAKER AND DIFFERENT
      # instrument from the CI gate: `cargo test` schedules serially per test
      # binary, nextest interleaves every binary across all cores, and the
      # interleave surfaces load-dependent failures the serial schedule hides.
      # That is not hypothetical. On v0.32.0's commit (e0e9e02) this job went
      # green and published to GitHub Releases, npm, the VS Code Marketplace,
      # Open VSX and the Homebrew tap while ci.yml on the identical sha was red
      # on both ubuntu and windows. A tag can be pushed from a commit no PR
      # ever saw, so this gate is the last thing standing between that commit
      # and five publishing channels, several of which are one-way. It has to
      # be the same instrument. Change these two legs and ci.yml's together.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest
      - name: The suite is green
        run: cargo nextest run --workspace
      # nextest does not run doc-tests. Every doc-test set is empty today;
      # this leg exists so a future doc-test cannot silently stop running.
      - name: The doc-tests are green
        run: cargo test --workspace --doc

  # ── ci.yml's other three legs, on the release side ──────────────────────────
  #
  # The suite legs above carry a two-sided rule ("change these two legs and
  # ci.yml's together") because a release gate weaker than the CI gate is how
  # v0.32.0 published on a tree ci.yml was red on. The same argument reaches
  # further than the suite: `fmt`, `clippy` and `audit` each decide a commit is
  # green on an ordinary push, and until now none of them decided a RELEASE was
  # publishable. A tag can be pushed from a commit no PR ever saw, so a tree
  # that is unformatted, carries a clippy finding, or links a crate with a
  # RustSec advisory could reach five publishing channels, several one-way,
  # with nothing in this file to stop it.
  #
  # Each is ci.yml's job character for character below its key. Separate JOBS
  # rather than steps in `gate`, for two halves of one reason: `gate` is a
  # two-OS matrix and all three legs are ubuntu-only there (formatting and
  # lints are platform-independent, and the advisory database is a property of
  # `Cargo.lock`), and `gate` declares `RUSTUP_TOOLCHAIN: stable` while `fmt`
  # and `clippy` must carry NONE — they resolve through rust-toolchain.toml,
  # whose pinned toolchain is exactly what makes their answer byte-stable
  # across a rustfmt or clippy release. Folding them into `gate` would silently
  # change both things.
  #
  # No `needs:` or `if:` on any of them: ci.yml gates these on its `changes`
  # job, which has no analogue on a tag push. A release runs every leg, every
  # time. `crates/vilan-cli/tests/release_gate.rs` holds all of this.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tree is formatted
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tree is clippy-clean
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The same installer the suite legs use for nextest, same pin.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-audit
      - name: No advisory against the dependency tree
        run: cargo audit --deny unsound

  build:
    needs: [gate, fmt, clippy, audit]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    # Load-bearing, not decoration: each leg's cross target is installed for
    # the toolchain the ACTION names, and rust-toolchain.toml (the formatter's
    # pin, N21) would otherwise resolve the build to its own channel — which
    # has no such target, failing every leg at build time.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: musl linker
        if: contains(matrix.target, 'musl')
        # apt on the hosted runners fails intermittently (mirror / index-fetch
        # hiccups) — one such blip on the arm runner sank an otherwise-green
        # v0.6.0 build. Retry with backoff so a transient network failure can't
        # fail the whole release.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "musl-tools install failed after 5 attempts"
          exit 1
      - name: Build (build paths remapped away)
        # `shell: bash` here and below: git-bash is preinstalled on the Windows
        # runners, so one script serves every leg (the default shell there is
        # pwsh, which speaks none of this).
        shell: bash
        # The CC_/LINKER variables point cc-rs (psm, via chumsky's stacker)
        # and the linker at musl-gcc; they are unused on the mac and Windows
        # targets.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          # git-bash spells $HOME and $PWD the POSIX way (a leading /<drive>
          # and forward slashes), but the paths rustc embeds on Windows are the
          # native ones — remap (and, in the next step, grep for) those instead,
          # or the reproducibility check would pass by never matching anything.
          if [ "${{ runner.os }}" = Windows ]; then
              build_home="$USERPROFILE"
              build_root="$GITHUB_WORKSPACE"
              echo "EXE=.exe" >> "$GITHUB_ENV"
          else
              build_home="$HOME"
              build_root="$PWD"
              echo "EXE=" >> "$GITHUB_ENV"
          fi
          echo "BUILD_HOME=$build_home" >> "$GITHUB_ENV"
          export RUSTFLAGS="--remap-path-prefix=$build_home=~ --remap-path-prefix=$build_root=/vilan"
          cargo build --release --target ${{ matrix.target }} -p vilan-cli -p vilan-lsp
      - name: No build-machine paths in the binaries
        shell: bash
        run: |
          for binary in vilan vilan-lsp; do
            # -F, not a regex: the Windows home is spelled with backslashes,
            # which a basic regex would swallow and then never match.
            if grep -qF "$BUILD_HOME" "target/${{ matrix.target }}/release/$binary$EXE"; then
              echo "$binary embeds the build home directory — remap failed"
              exit 1
            fi
          done
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/vilan" \
             "target/${{ matrix.target }}/release/vilan-lsp" \
             LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          tar -czf "vilan-${{ matrix.target }}.tar.gz" -C dist \
              vilan vilan-lsp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt
      - name: Package (Windows)
        if: runner.os == 'Windows'
        # A `.zip` is the Windows convention, and what `install.ps1` and
        # `vilan upgrade` consume. `Compress-Archive` rather than one more
        # bash step running `tar -a -cf …zip`: under `shell: bash` the `tar` on
        # PATH is Git-for-Windows' GNU tar, whose `-a` cannot write zip and
        # instead produces an *uncompressed tar named `.zip`* — exit 0, no
        # warning (probe-verified with GNU tar 1.35). Compress-Archive has no
        # such failure mode, and this is the only step that needs a second
        # shell. Entries land at the archive root, matching the tarball layout.
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vilan.exe",
                    "target/${{ matrix.target }}/release/vilan-lsp.exe",
                    LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.txt dist/
          Compress-Archive -Path dist/* -DestinationPath "vilan-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          # `.tar.gz` or `.zip` — one archive per leg either way.
          path: vilan-${{ matrix.target }}.*
          if-no-files-found: error

  vsix:
    needs: [gate, fmt, clippy, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Package the extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package --out ../../vilan-vscode.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-vsix
          path: vilan-vscode.vsix
          if-no-files-found: error

  # The playground's compiler, shipped as a release asset (D11 §4, call (b)).
  # The website's deploy downloads it from the release the same way it already
  # downloads install.sh, so the site job stays free of Rust — the property
  # 53aa11d bought and this deliberately does not spend.
  wasm:
    needs: [gate, fmt, clippy, audit]
    runs-on: ubuntu-latest
    # Same reason as `build`: the wasm32 target belongs to the action's
    # toolchain, not rust-toolchain.toml's pinned channel.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      # Pinned to the `wasm-bindgen` crate version in vilan-wasm/Cargo.toml —
      # a mismatch between the two fails in the browser, not in this job.
      - name: wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      # The 16 MiB `-zstack-size` is the compiler's stack inside the page's
      # linear memory — and unlike a native thread's reservation, this is
      # memory the visitor's browser actually commits, so it is sized rather
      # than guessed.
      #
      # Every recursive family in the pipeline is depth-bounded now
      # (B138/B139/B142): the parser at 500 levels of nesting, the phase-1
      # expression walk at 500, the return-inference chain at 500 links. That
      # is what gives a finite worst case to size against, where before there
      # was none.
      #
      # Measured HERE rather than extrapolated from native frame sizes, because
      # this profile differs from `release` (opt-level="z" + fat LTO): the
      # `wasm-release` artifact was built at a range of `-zstack-size` values
      # and run under node against the same pathological plants the parser's
      # own pins use. 8 MiB compiles every one of them, including the two worst
      # (5000 nested parentheses, 5000 nested calls); 4 MiB traps on those two
      # and passes the rest. The real need therefore sits between 4 and 8 MiB,
      # and 16 MiB is at least 2x the size proven sufficient.
      #
      # This was 64 MiB while the parser was unbounded, where the headroom was
      # standing in for a bound that did not exist. It does now, and the 48 MiB
      # given back is linear memory the page no longer reserves.
      - name: Build
        run: |
          RUSTFLAGS="-C link-arg=-zstack-size=16777216" \
            cargo build -p vilan-wasm --profile wasm-release \
              --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/wasm-release/vilan_wasm.wasm
      # Shipped gzipped: it halves what the visitor downloads, and it sidesteps
      # the two things GitHub Pages will not let the site control — the `.wasm`
      # Content-Type and whether Pages compresses it. The page inflates through
      # `DecompressionStream`.
      - name: Package
        run: |
          mkdir dist
          gzip -9 -c pkg/vilan_wasm_bg.wasm > dist/vilan_wasm_bg.wasm.gz
          cp pkg/vilan_wasm.js dist/
          tar -czf vilan-playground-wasm.tar.gz -C dist \
              vilan_wasm_bg.wasm.gz vilan_wasm.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The `release-*` prefix is what `publish` globs, so this joins the
          # asset list and the checksum file with no edits there.
          name: release-wasm32
          path: vilan-playground-wasm.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, vsix, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Checksums + the install scripts
        run: |
          cp scripts/install.sh scripts/install.ps1 release-assets/
          # Hashes whatever assets exist, so the Windows .zip needs no
          # special-casing here. (Scratch dir is release-assets, NOT assets/
          # — that is a tracked directory holding the brand SVGs.)
          cd release-assets && sha256sum * > sha256sums.txt
      - name: Release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="^## v$VERSION " \
            '$0 ~ heading {inside=1; next} /^## / && inside {exit} inside' \
            CHANGELOG.md > notes.md
          test -s notes.md
          # GitHub caps a release body at 125,000 CHARACTERS, and a large
          # release's section can exceed it (v0.40.0 did, at 74 entries:
          # 220,256 characters in 221,530 bytes). The unit matters, because
          # the changelog is dense with em-dashes and `§` and the two counts
          # drift apart by over a thousand: `read()` returns a decoded `str`,
          # so `len(text)` below is characters — GitHub's unit — and NOT the
          # file's byte length. Measuring bytes would cut early, which is
          # merely wasteful; the reverse would fail the publish.
          # Over the cap, keep whole entries up to a safe margin and point
          # at the changelog for the rest — never a mid-entry cut.
          python3 - "$VERSION" <<'PY'
          import sys
          version = sys.argv[1]
          text = open("notes.md").read()
          CAP = 110_000
          if len(text) > CAP:
              entries = text.split("\n<!-- family:")
              kept, size = [entries[0]], len(entries[0])
              for entry in entries[1:]:
                  size += len(entry) + len("\n<!-- family:")
                  if size > CAP:
                      break
                  kept.append(entry)
              dropped = len(entries) - len(kept)
              tail = (f"\n\n---\n\n*These notes hit GitHub's release-body cap: "
                      f"{dropped} more entries are in [CHANGELOG.md's v{version} section]"
                      f"(https://github.com/vilan-lang/vilan/blob/v{version}/CHANGELOG.md).*\n")
              open("notes.md", "w").write("\n<!-- family:".join(kept) + tail)
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "vilan ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md

  # The npm channel (proposal/distribution.md §2): the same artifacts, repacked
  # as the six packages `npm install -g @vilan-lang/vilan` delivers. Sources in
  # npm/, assembly in scripts/npm-package.sh, stubs pinned by
  # crates/vilan-cli/tests/npm_stub.rs.
  publish-npm:
    # After `publish`, not beside it: an npm version can be deprecated but
    # never replaced, so npm must not carry a version whose GitHub Release
    # failed to go out.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (distribution.md §2): npm trusts *this workflow in
      # this repository* rather than a stored credential, so the job proves who
      # it is with a per-run OIDC token and there is no NPM_TOKEN to expire,
      # rotate, or leak. Each of the six packages carries the matching trusted
      # publisher — org `vilan-lang`, repo `vilan`, workflow `release.yml` — and
      # all three fields are case-sensitive on npm's side.
      id-token: write
      # A job-level `permissions:` block replaces the workflow-level one
      # outright, so the checkout's read has to be named again here.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Deliberately no `registry-url`, which is not an oversight and must
          # not be "fixed" back in: it makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
          # and with no token in the environment that expands to an *empty*
          # credential. npm reads the line's presence as "auth is already
          # configured", never starts the OIDC exchange, and the publish fails
          # unauthenticated (actions/setup-node#1551). The default registry is
          # registry.npmjs.org anyway, so the line bought nothing.
      - name: An npm that can publish by OIDC
        # Trusted publishing needs npm >= 11.5.1. Which npm a Node release
        # bundles is not ours to choose and moves under us, so the requirement
        # is stated here instead of being inherited from `node-version: 24`.
        # `^11.5.1` rather than `latest` on purpose: it is the major whose
        # publish behavior this job was written against, every version in it
        # satisfies the requirement, and a future npm 12 lands here as a
        # deliberate bump rather than mid-release.
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Assemble the six packages
        # Every package.json under npm/ carries `0.0.0-placeholder`; the script
        # stamps this tag's version over all six (the meta package's
        # optionalDependencies included, so they stay locked to the exact
        # version) and re-reads them to prove the stamping took. That is why
        # scripts/bump-version.sh knows nothing about npm.
        run: scripts/npm-package.sh "${GITHUB_REF_NAME#v}" release-assets npm-dist
      - name: Publish
        # No disabled-until-secret-exists gate, unlike the other three publish
        # jobs, and the asymmetry is deliberate. That gate exists so a job can
        # land before its channel is provisioned; npm is provisioned, and there
        # is no longer a secret whose absence could stand in for "not live yet".
        # A silent skip would now be the dangerous outcome — it is how v0.18.0
        # shipped five of six packages and read green.
        run: |
          publish() {
            log="$(mktemp)"
            if npm publish --access public "$1" > "$log" 2>&1; then
              cat "$log"
              return 0
            fi
            cat "$log"
            # The one error a re-run must survive: this exact version is
            # already on the registry. Matched on the registry's own words, so
            # that every *other* 403 — a revoked token, a scope this account
            # does not own — still fails the job.
            if grep -qE 'EPUBLISHCONFLICT|cannot publish over the previously published version' "$log"; then
              echo "::notice title=npm publish skipped::$1 is already published at this version — left alone."
              return 0
            fi
            return 1
          }
          # Platform packages first, the meta package last: it depends on them
          # by exact version, so the other order would leave a window in which
          # `npm install -g @vilan-lang/vilan` resolves nothing to run.
          # Iterating what the assembly produced, rather than a list spelled
          # out again here, keeps this from becoming one more place a new
          # target would have to be added.
          for package in npm-dist/*/; do
            [ "$package" = npm-dist/vilan/ ] || publish "$package"
          done
          # The trailing slash is load-bearing. Without it npm reads
          # `npm-dist/vilan` as its `<user>/<repo>` GitHub shorthand and tries
          # `git ls-remote ssh://git@github.com/npm-dist/vilan.git` instead of
          # publishing the directory — which is exactly how v0.18.0 shipped
          # five platform packages and no meta package. The loop above was
          # always safe: its paths come from a `*/` glob, so they already end
          # in one.
          publish npm-dist/vilan/

  # The editor galleries (proposal/distribution.md §3): the `.vsix` the release
  # already carries, uploaded to the VS Code Marketplace and to Open VSX.
  #
  # Neither job checks the repository out. The artifact `vsix` built is the
  # entire input, so what the galleries serve is byte-for-byte the file on the
  # GitHub Release — there is no second packaging run to disagree with it.
  #
  # Idempotence is `--skip-duplicate`, which both tools implement as their own
  # already-published predicate rather than a message match: vsce skips when the
  # version is in the extension's version list or the upload comes back 409, and
  # ovsx when the registry answers "… is already published." Everything else —
  # a revoked token, a namespace this account cannot publish to — still throws,
  # so a re-run of a half-finished release is safe and a broken one is not
  # silently green.
  publish-marketplace:
    # `vsix` for the package, `publish` for the same rule publish-npm follows: a
    # marketplace version can be unpublished but never replaced, so it must not
    # carry a version whose GitHub Release failed to go out.
    needs: [vsix, publish]
    runs-on: ubuntu-latest
    # The environment is not decoration: the federated credential in Entra
    # trusts the subject `repo:vilan-lang/vilan:environment:marketplace`, so
    # GitHub only mints an OIDC token this app will accept when the job runs
    # here. Removing this line does not weaken the auth, it breaks it.
    environment: marketplace
    permissions:
      # Required for GitHub to issue the OIDC token `azure/login` exchanges.
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Is there an identity to publish with?
        id: marketplace
        # A job-level `if:` cannot read `secrets`, so the secret's presence
        # becomes a step output the rest of the job conditions on
        # (distribution.md §6 — every publish job lands
        # disabled-until-secret-exists). publish-npm no longer carries this:
        # trusted publishing leaves it no secret to test.
        #
        # Entra workload identity federation rather than a PAT, and not by
        # preference: Azure DevOps retires global PATs — the "all accessible
        # organizations" scope `vsce` requires — on 2026-12-01, after which a
        # PAT-based publish simply stops. Federation also leaves NO stored
        # credential to expire or leak; the ids below are identifiers, not
        # secrets, and are kept as secrets only so this gate reads like the
        # other three.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Marketplace publish skipped::AZURE_CLIENT_ID / AZURE_TENANT_ID are not configured, so the extension was not published to the VS Code Marketplace. Register an Entra app with a federated credential for this repo's `marketplace` environment and add it to the vilan-lang publisher. The rest of the release is unaffected."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.marketplace.outputs.publish == 'true'
        with:
          name: release-vsix
      - name: Sign in to Entra
        if: steps.marketplace.outputs.publish == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # There is no Azure subscription behind this and there does not need
          # to be: the app registration lives in the tenant, and publishing
          # touches the Marketplace, not any Azure resource. Without this the
          # action fails looking for a subscription to select.
          allow-no-subscriptions: true
      - name: Publish
        if: steps.marketplace.outputs.publish == 'true'
        run: |
          npx --yes @vscode/vsce publish \
            --packagePath vilan-vscode.vsix \
            --azure-credential \
            --skip-duplicate

  publish-openvsx:
    # The same extension for VSCodium / Cursor / Theia (distribution.md §3).
    # Separate from the marketplace job on purpose: one gallery being down, or
    # one token missing, must not hold the other back.
    needs: [vsix, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Is there a token to publish with?
        id: openvsx
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -n "$OVSX_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Open VSX publish skipped::OVSX_TOKEN is not configured, so the extension was not published to Open VSX. The rest of the release is unaffected."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.openvsx.outputs.publish == 'true'
        with:
          name: release-vsix
      - name: Publish
        if: steps.openvsx.outputs.publish == 'true'
        # Two one-time provisioning steps sit behind this, both done by hand
        # (distribution.md §7), and BOTH fail the job rather than being
        # invented for you:
        #
        # 1. The `vilan-lang` namespace must exist — Open VSX auto-creates
        #    none. `npx ovsx create-namespace vilan-lang -p <token>`.
        #    (Done 2026-07-29.)
        # 2. The Eclipse Foundation Open VSX **Publisher Agreement** must be
        #    signed by the account the token belongs to. This is the real gate:
        #    a valid token with no signed agreement still cannot publish.
        #
        # The namespace being UNVERIFIED does not block anything — it only
        # means the listing carries a warning icon instead of the shield.
        # Ownership is claimed separately, by a public issue on
        # EclipseFdn/open-vsx.org, and can happen after the first publish.
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          npx --yes ovsx publish vilan-vscode.vsix \
            -p "$OVSX_TOKEN" \
            --skip-duplicate

  # The Homebrew tap (proposal/distribution.md §4): one formula in
  # vilan-lang/homebrew-vilan, repointed at this release.
  #
  # The formula is generated, never hand-written — `scripts/brew-formula.sh`
  # renders it from a version and the release's own `sha256sums.txt`, and
  # `homebrew/Formula/vilan.rb` in this repository is that script's output for
  # the current release (the bytes that seeded the tap).
  # crates/vilan-cli/tests/brew_formula.rs re-runs the script and compares, so
  # what this job pushes and what a reviewer reads cannot drift apart.
  publish-brew:
    # `publish` for the reason publish-npm waits on it, and more sharply: every
    # `url` in the formula points at a release asset, so a tap updated before
    # the release exists advertises four downloads that 404 — and Homebrew
    # caches by checksum, so a user who hits that window gets an error, not a
    # retry. `build` is named too because those are the archives being pointed
    # at.
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Is there an app to push with?
        id: brew
        # A job-level `if:` cannot read `secrets`, so the secret's presence
        # becomes a step output the rest of the job conditions on
        # (distribution.md §6 — every publish job lands
        # disabled-until-secret-exists). publish-npm no longer carries this:
        # trusted publishing leaves it no secret to test.
        #
        # A GitHub App rather than a PAT, matching the site deploy's auth: an
        # App's private key does not expire, and this credential is used ONLY at
        # release time — so a PAT's expiry would lapse unnoticed and surface
        # months later, mid-release. (Worse, the gate below cannot catch it: an
        # expired token is still a non-empty string, so the job would pass the
        # check and fail at the push.) Each run mints a short-lived installation
        # token instead.
        env:
          TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
          TAP_APP_PRIVATE_KEY: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$TAP_APP_ID" ] && [ -n "$TAP_APP_PRIVATE_KEY" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew tap not updated::TAP_APP_ID / TAP_APP_PRIVATE_KEY are not configured, so vilan-lang/homebrew-vilan still points at the previous release. Create a GitHub App with contents read-write installed on vilan-lang/homebrew-vilan and store its id and private key as these secrets. The rest of the release is unaffected."
          fi
      - name: Mint the tap token
        id: app
        if: steps.brew.outputs.publish == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: vilan-lang
          # Scoped to the tap alone: the token this mints can reach nothing
          # else in the org, whatever the app is installed on.
          repositories: homebrew-vilan
      - name: The release's own checksums
        if: steps.brew.outputs.publish == 'true'
        # Taken from the release rather than recomputed from the build
        # artifacts: this is the same file `install.sh` verifies downloads
        # against, so the tap's four hashes are by construction the ones the
        # release page publishes — there is no second computation that could
        # disagree with it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern sha256sums.txt
      - name: Update the tap
        if: steps.brew.outputs.publish == 'true'
        env:
          # The app's installation token, minted above and valid for this run
          # only. Same `x-access-token:` clone form a PAT used.
          TAP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/vilan-lang/homebrew-vilan.git" tap
          # `Formula/` is where `brew tap` looks; the seeded tap already has
          # it, and a tap that somehow does not still gets a working formula
          # rather than a redirect into a missing directory.
          mkdir -p tap/Formula
          scripts/brew-formula.sh "$VERSION" sha256sums.txt > tap/Formula/vilan.rb
          git -C tap add Formula/vilan.rb
          # Re-running a release must be harmless: the formula is a pure
          # function of the version and the checksums, so a second run produces
          # the same bytes and there is simply nothing to commit.
          if git -C tap diff --cached --quiet; then
            echo "::notice title=Homebrew tap already current::the tap's formula is already vilan $VERSION — nothing to push."
            exit 0
          fi
          git -C tap \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "vilan $VERSION"
          git -C tap push
