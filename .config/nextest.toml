# Suite parallelism (E25, proposal/suite-speed.md): nextest runs every test
# in its own process with all binaries interleaved, replacing cargo test's
# strictly serial binary-by-binary execution. Doc-tests are NOT run by
# nextest — today every doc-test set is empty, and CI keeps a
# `cargo test --workspace --doc` leg so a future doc-test cannot silently
# stop running.

# fail-fast off mirrors the suite discipline's --no-fail-fast: a run is the
# instrument that produces the COMPLETE failure list (the exit code still
# gates).
[profile.default]
fail-fast = false

# N163 (Order 50): THE TIERS, RE-MEASURED UNDER `ci-test`. Every figure below is
# from one full run of the 10,157-test suite under `--cargo-profile ci-test`
# (vilan-core at opt-level 1, N156), 762.7 s wall at -j 6 and loadavg 10-25 on
# the 16-core dev box, next @5fe24f86, per-test wall from nextest's JUnit output;
# the CPU figures are one test alone (`-j 1`, the process tree's user+system).
# The tiers used to be ranked at opt-level 0, where analysis-bound tests cost
# ~3.2x more: the edit-replay corpus leg was 293 s then and is 97 s now (839 CPU-s
# alone, because it fans out 16 ways inside), the docs gate 212 s -> 29 s, the
# check-scope corpus legs 100 s -> 23 s, the native differential's whole-suite legs
# 119-184 s -> 22-32 s, and the Linux leak plateaus 10-32 s -> 17-22 s. The suite
# is throughput-bound at -j 6 (4,572 test-seconds / 6 = 762 s), so the order
# barely shows in the total and decides only the TAIL: a long test started late
# is the last thing running. Longest-first is the classic makespan rule.
#
# Two kinds of long test, and a tier is for both:
#   - COMPUTE: wall is long because the work is (or because it fans out wide and
#     takes every core while it runs);
#   - WAITING: ~0 CPU (`transport_robustness`' retry budget 1.8 CPU-s in 25 s,
#     `service_layer`' socket test 1.5 in 25 s) - it holds a slot and does
#     nothing, so started LATE it extends the tail for free and started early its
#     idle time overlaps the compute.
# The names are a schedule, not a gate: a name that rots costs the run its order,
# never a test. Re-measure before trusting the ranking on a different box, and
# when a binary's cost moves by a factor (the next profile change, the next
# differential that earns its own binary).

# TIER 100 - the stragglers: >= 35 s of wall in the suite, or hundreds of CPU-s.
#
# `edit_replay_differential` is 17 tests and 474 s of the run's 4,572: its corpus leg
# (97 s wall) is the single longest test, and the nine edit-class tests beside it
# are 34-42 s each (24 CPU-s each: they wait on the corpus's pool). The
# permutation differential (P0, Order 49) is the same shape - three tests of
# 36-45 s, the corpus leg 297 CPU-s alone - and was UNTIERED until now, so it
# started wherever the alphabet put it. `dependent_edit_measurement` (35 s) and
# the diagnostics ledger's `n99_` test (35 s, 32 CPU-s on ONE thread: it scans
# the analyzer's source) are the single-thread stragglers: nothing inside them
# shortens the wall, so only starting them first does.
#
# Neither of the measurement pins asserts anything about TIME -
# `dependent_edit_measurement` prints its per-analysis wall clocks and asserts on
# leak-tally BYTES (tracker N46) - so there is nothing here for a liveness bound
# or a CPU clock to fix. They are simply long.
[[profile.default.overrides]]
filter = '''
    binary(edit_replay_differential)
    + binary(permutation_differential)
    + test(dependent_edit_measurement)
    + (binary(diagnostics_ledger) & test(n99_the_two_unreachable_messages))
'''
priority = 100
# The edit-replay differential's corpus leg is 97 s in the suite and 149 s alone
# under load 12; the 60 s default flags it as slow on every run. The kill is at
# 15 minutes, which nothing but a hang can reach.
slow-timeout = { period = "180s", terminate-after = 5 }

# TIER 90 - 15-35 s of wall in the suite, or tens of CPU-s that fan out wide.
#
# The Linux leak plateaus (17-22 s: looped analyses), the replay differential's
# two legs (24-25 s in the suite, 65 CPU-s each; they were tier 100 at 60-170 s),
# `style_chain_order` (19 s), the docs gate (29 s wall, 51 CPU-s), the check-scope
# corpus legs (20-23 s, 62 CPU-s), the native differential's whole-suite legs and
# its five longest programs (13-32 s), the diagnostics ledger's source scans
# (17-18 s each, five of them), and the two waiting tests named above.
#
# Dropped from the old tier 90 as no longer long: `examples`' `every_example_builds`
# (6.5 s) and `corpus`' golden leg (13.8 s). The binary this block used to keep
# at 100 for `slow-timeout` (`replay_differential`) keeps its raised timeout here.
[[profile.default.overrides]]
filter = '''
    test(leak_measurement)
    + binary(style_chain_order)
    + binary(replay_differential)
    + (binary(docs) & test(every_doc_example_compiles))
    + (binary(check_scope_differential) & test(/^corpus_agrees_/))
    + (binary(native_differential)
        & test(/^(the_default_suite_is_byte_identical|s0_every_panic_path_reports|the_native_(leak|copy)_census|a138_|a142_|a_mapped_tuple_and_its_comprehension|every_platform_bound_program)/))
    + binary(diagnostics_ledger)
    + (binary(transport_robustness) & test(a_spent_retry_budget))
    + (binary(service_layer) & test(/^(a_bare_connect_socket_offers_vilan_rpc|a_trusted_forwarded_header)/))
'''
priority = 90

[[profile.default.overrides]]
filter = 'binary(replay_differential)'
slow-timeout = { period = "180s", terminate-after = 5 }

# The marker census (B485) analyzes a few hundred probe programs on a worker
# pool of its own - compute, like the replay differential above - and is 12 s in the
# suite now (6.8 CPU-s alone; it was "20 s alone, ~2 min at loadavg 60" at
# opt-level 0). It keeps a tier-90 start and its raised timeout for the loaded
# box it can still meet.
[[profile.default.overrides]]
filter = 'binary(marker_census)'
priority = 90
slow-timeout = { period = "180s", terminate-after = 5 }

# The wall-clock waits run ONE AT A TIME (tracker N46).
#
# Every member waits, on the wall clock, for work happening on ANOTHER thread or
# in another process to land: a `vilan build --watch` / `run --watch` round (a
# compile plus the build commands, observed through a file the round writes), or
# the language server's debounced re-analysis and the package sweep behind it.
# The bound is a liveness bound in each case, and it has now been paid four
# times over: Order 20's close, Order 24's hygiene lane, Order 24's pre-seal
# union — the same 301 s red each time, on a pin that costs 0.6 s alone — and
# two sibling lanes' unions, where `package_recolor_tests`' 10 s settle window
# was eaten under ten-lane load by a recolor that takes 13.8 s alone.
#
# The suite is the only load this repository controls, and until now it piled
# the family onto itself: 31 tests, most with a compile behind them, all
# eligible to run at once inside an interleave already 16 wide. One thread for
# the group ends that. It does not (and cannot) fix a box loaded by something
# else — that is the honest limit of this lever, and the reason each pin's own
# bound was ALSO fixed where it was too small to be a liveness bound at all
# (`settled`'s 10 s, `release_differential`'s 30 s) rather than left to the
# group to rescue.
#
# The other direction the item names — making the wait CPU-time-aware, the way
# M15 fixed the const-pass gate — was MEASURED and rejected, because the shape
# does not transfer. M15's subject is a computation, and preemption does not
# accrue to a computation's own CPU clock. This subject is an EVENT delivered
# by a 300 ms poll loop that sleeps between polls, and the numbers say so: at
# loadavg 79, a watcher waiting with nothing to do burns 0.030 s of CPU per
# 30 s of wall — 1.0 ms/s, set by the poll rate and not by the load — while the
# round it is waiting for costs 0.33 s (round 1) and 0.02 s (round 2). A
# deadline denominated in the watcher's own CPU is therefore a wall deadline
# wearing different units, and it makes the two states the bound has to tell
# apart — starved and stuck — indistinguishable rather than distinguishable.
[test-groups]
wall-clock-waits = { max-threads = 1 }

[[profile.default.overrides]]
# `hmr`, `hmr_swap`, `hmr_css_matrix`, `watch_lifecycle` and `watch_leg_reuse` are
# watch sessions end to end, so they join whole. The next six binaries are mostly one-shot
# `build` pins with a watch family inside them, and the family is named the way
# it is spelled: every one of these tests carries `watch` or `round` in its
# name. A name filter can rot in silence, so it does not stand alone —
# `build_hooks`'s `every_test_that_drives_a_watch_session_is_in_the_group`
# reads all ten files and reds if a test spawns a watcher from outside the set
# this line selects. It is what found `split` and `serve_build`, whose one
# watch round each was invisible to a filter written off the HMR suites.
#
# The two `package_recolor_tests` pins are the other shape the group is for and
# the reason it is not named after watch rounds: no watcher, no child process —
# a `did_change` on one open buffer, and then a poll waiting for the language
# server's debounced analysis and its package sweep to recolor a DIFFERENT open
# buffer. Same bound, same failure, same cure.
#
# `watched_files_tests` (E127) is the same shape once more: a
# `didChangeWatchedFiles` notification on one open buffer's package, and then a
# poll waiting for the sweep it starts to re-analyze that buffer so its
# completion sees a module that has just appeared on (or vanished from) disk.
# No watcher and no child process — the wait is on the language server's own
# analysis thread, which is exactly what this group stops the suite from piling
# onto itself.
#
# `dead_item_clock_tests` (E124) is the recolor shape once more, with one more
# clock on top: after the debounced analysis it waits for the PACKAGE clock's
# idle timer and the union behind it — one full analysis per declared entry —
# to land before the top-level gray it asserts can exist at all.
#
# `cancellation_tests` (M26) is that same shape again, and one of them adds a
# reason of its own: `a_burst_of_edits_...` types eight keystrokes, each sent
# once the server's own counter says the previous one's analysis has started
# (N164: a sleep-paced burst folded into one window on a stalled runner), and
# counts how many of the analyses they started ran to the end. Its assertion
# is a COUNT and load can only push it the safe way — a slower box cancels
# MORE — but the burst itself is eight debounce windows of wall clock with real
# analyses behind them, which is precisely the work this group exists to stop
# the suite from piling onto itself.
filter = '''
    binary(hmr) + binary(hmr_swap) + binary(hmr_css_matrix) + binary(watch_lifecycle)
    + binary(watch_leg_reuse)
    + ((binary(build_hooks) + binary(assets) + binary(asset_bundle) + binary(split)
        + binary(serve_build) + binary(parallel_build)) & test(/watch|round/))
    + (binary(vilan-lsp) & test(/package_recolor_tests|cancellation_tests|watched_files_tests|dead_item_clock_tests/))
'''
test-group = 'wall-clock-waits'
# Advisory at 120 s, killed at 8 minutes. The pins' own `WATCH_LIVENESS` (300 s)
# is well inside that on purpose: a hung round should be reported by the pin,
# which panics with the round counts and the watcher's whole log, not by a
# runner that can only say "terminated". What `terminate-after` buys is the
# case the pin's own bound cannot reach — a watcher child that never exits, a
# wait somebody writes without a bound — where the alternative is a CI runner
# held until the job timeout.
slow-timeout = { period = "120s", terminate-after = 4 }
