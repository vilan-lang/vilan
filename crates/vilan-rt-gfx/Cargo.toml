# The GPU graphics layer of native vilan programs: the Rust half of `std::gfx`
# (native-ui.md, part P1; every question of its section 9 RULED 2026-11-10).
#
# A window (`winit`), a GPU device (`wgpu`), and a renderer of our own for the
# primitives a user interface is made of — rounded rectangles with borders and
# gradients, analytic shadows, text runs, underlines and images, under clips,
# transforms and opacity layers — drawn as instanced quads whose shape the
# fragment shader computes. Text is shaped by `parley` and rasterised by
# `swash` behind a small internal interface (R3, R15), into a glyph atlas this
# crate owns.
#
# LINKED BY USE: a program that reaches `std::gfx` (`vilan/std/src/gfx.vl`)
# names this crate in its generated cargo project, which starts from THIS
# crate's lockfile (the CLI seeds it), and its emitted `main` hands the main
# thread to the host in `src/host/` (native-ui.md R8). A program that does not
# reach `std::gfx` never builds it.
#
# OUTSIDE the compiler's workspace (R11), as `vilan-rt-webview` is: the root
# `Cargo.toml` lists this directory under `exclude`, and the crate carries its
# OWN `Cargo.lock`. Not for advisories (the audit passes) but for WEIGHT, and
# for one licence: the stack is 368 packages in its lockfile (this crate,
# `vilan-rt` and `vilan-rt-poll` among them) against the compiler's 191, and
# every licence is on the compiler's list but BSL-1.0, which `arboard`'s
# Windows half (`clipboard-win`, `error-code`) carries and this crate's
# `about.toml` accepts by name (F181); nobody building the compiler
# should compile a GPU stack. Its own CI job (`scripts/ci-local.sh
# gfx`, ci.yml's `gfx`) holds it to fmt, clippy, its tests (golden images and
# the window proof REQUIRED there), `cargo audit --deny unsound` and its own
# licence notices.
#
# Every direct dependency is pinned EXACTLY: a renderer's output is held to
# committed golden images, and a minor release of the GPU, text or font stack
# is exactly the kind of change that moves a pixel.
[package]
name = "vilan-rt-gfx"
version = "0.55.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The GPU graphics layer (std::gfx) of programs the vilan compiler emits as Rust."
publish = false
# The test font (Noto Mono, OFL-1.1) and the golden images are TEST data: they
# stay in the repository and out of anything packaged from this crate. The
# crate itself bundles no font; a program draws with the system's fonts or
# with fonts it registers (`TextSystem::register_font`).
exclude = ["tests/"]

[dependencies]
# Native backends only: Vulkan (Linux, Windows, Android), Metal (macOS), DirectX
# 12 (Windows) and OpenGL ES / desktop GL as the fallback where none of those
# exists. `webgpu` (the browser) is left out until the browser part (P6) has
# its own paper; nothing in the renderer rules it out — no storage buffers, no
# compute, limits held to WebGL2's (see `gpu.rs`).
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "gles",
] }
# Windows and input. Default features off, each kept one named: X11 and
# Wayland, Wayland's client library opened at run time (no build-time
# dependency on libwayland), and the Adwaita client-side decorations WITHOUT
# their title text: the titled variant draws the title with `ab_glyph`, whose
# `ttf-parser` is unmaintained (RUSTSEC-2026-0192) and is otherwise nowhere in
# this tree. A Wayland compositor that draws its own decorations (KDE, wlroots)
# shows the title as usual; GNOME's client-side bar shows it blank.
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
# Shaping and paragraph layout. Default features (`system`: the platform's
# font enumeration — fontconfig, DirectWrite, CoreText) kept. Thai, Lao, Khmer
# and Burmese dictionary line breaking (`complex-scripts`) is left out for its
# size; those scripts still shape and break at spaces.
parley = { version = "=0.12.0" }
# Named directly for one feature: fontconfig is opened at RUN time instead of
# linked at build time, so a build machine needs no libfontconfig development
# package. Where the library is missing at run time the system font list is
# empty and registered fonts still work. Same version `parley` resolves.
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
# Glyph rasterisation: outlines, colour outlines (COLR) and colour bitmaps
# (emoji). Default features (`scale`, `render`) are the rasteriser.
swash = { version = "=0.2.10" }
# `std::ui`'s layout (native-ui.md P2, R4): flexbox for rows and columns, and
# a one-cell grid for stacks (every child in the same cell, anchored by its
# own alignment), under std::ui's vocabulary — the solver is invisible in the
# surface, and grid is never offered to a program. Default features off, each
# kept one named: the tree with its per-node cache (`taffy_tree`), flexbox,
# grid. No CSS parser, no block or float layout, no `calc`.
taffy = { version = "=0.15.1", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
] }
# `std::ui`'s roles, labels and states published to the system's
# accessibility API, and its actions taken back in (native-ui.md section 4.6,
# R10; part P5): `accesskit`'s tree, and its `winit` adapter, which picks the
# platform's (AT-SPI over D-Bus on Linux and the BSDs, UI Automation on
# Windows, NSAccessibility on macOS). The adapter matches the pinned `winit`
# (it asks for `^0.30.5`). Default features off, each kept one named: the
# Linux adapter on `async-io` (the program's executor is not tokio) and
# `raw-window-handle` 0.6, which `winit` already brings.
accesskit = { version = "=0.25.2" }
accesskit_winit = { version = "=0.34.2", default-features = false, features = [
    "accesskit_unix",
    "async-io",
    "rwh_06",
] }
# The system clipboard's TEXT (F173, RULED 2026-11-12: `arboard`, pinned,
# behind `std::gfx`'s two clipboard functions so it stays replaceable;
# `src/host/clipboard.rs` is the only file that names it). Default features
# off: `image-data` would bring the `image` crate's PNG, TIFF and BMP codecs
# for pictures nobody copies through this surface. X11 (and Wayland through
# XWayland) is its own `x11rb` connection and serving thread; Windows is
# `clipboard-win`; macOS is `NSPasteboard` through `objc2`. Wayland's
# data-control protocol (`wayland-data-control`) is left out: see the module
# doc of `src/host/clipboard.rs` for why.
arboard = { version = "=3.7.0", default-features = false }
# Instance data is uploaded as plain bytes.
bytemuck = { version = "=1.25.2", features = ["derive"] }
# Blocks on the adapter and device requests (wgpu's are futures).
pollster = { version = "=1.0.1" }
# The vilan program's side (`src/host/`): the runtime the emitted program
# links (its executor, which the window loop drives through the hosted turn,
# R8), and the readiness wait whose helper thread watches the program's
# sockets while the window loop owns the main thread. Path dependencies on
# the compiler's own runtime crates, which a generated project materializes
# beside this one.
vilan-rt = { path = "../vilan-rt" }
vilan-rt-poll = { path = "../vilan-rt-poll" }

[dev-dependencies]
# Golden images are PNG files.
png = { version = "=0.18.1" }

# The window example closes ITSELF through the X server, with the same
# WM_DELETE_WINDOW message a window manager sends, so the xvfb proof exercises
# the real close path; and `examples/x11_input.rs` moves and clicks the pointer
# through XTEST for the compiler's `std::gfx` end-to-end test. `x11rb` is
# already in the tree (winit's X11 backend); `xtest` adds no package.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }

# A workspace of its own: the compiler's root manifest EXCLUDES this
# directory, and without this table cargo would keep walking up past it (to an
# enclosing checkout, when this tree is a worktree inside one).
[workspace]

# Not the compiler's `[workspace.lints]` (this crate is not in that workspace):
# the same bar, stated here. No `unsafe` anywhere in the crate: `wgpu` and
# `winit` carry the platform FFI.
[lints.rust]
unsafe_code = "forbid"
