# A browser app on `std::reactive` + `std::ui`. The package's `target` is
# `browser`, so a plain `vilan build .` emits `app.js` beside `index.html` —
# no `--target` flag. Sources sit beside this manifest, so `root` is `.`.
#
#   vilan build .   compile `app.vl` -> `app.js`
#   vilan check .   type-check without writing anything
#
# Then open `index.html`. Serve the directory over HTTP (any static server) if
# your browser refuses ES modules on `file://`.
#
# `prelude` names the ambient scope every file here resolves under — the names
# in scope with no import. `std::web` is the set for applications: the base
# seven (`print`, `Option`/`Some`/`None`, `Result`/`Ok`/`Err`) plus `Signal`,
# `view` and `View`, plus the MODULES `style` and `ui`, which is why the
# sources beside this file write `style::Display` and `ui::mount_root` with no
# import. Omit the key for the base set; `false` turns it off.
[package]
name = "{{name}}"
root = "."
entry = "app.vl"
target = "browser"
prelude = "std::web"
