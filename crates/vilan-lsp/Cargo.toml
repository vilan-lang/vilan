[package]
name = "vilan-lsp"
version = "0.40.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vilan-lsp"
path = "src/main.rs"

[dependencies]
vilan-core = { path = "../vilan-core" }
# The completion engine, the line index, and the navigation primitives hover
# and definition read — shared with the playground (K9,
# proposal/playground-completion.md §3).
vilan-ide = { path = "../vilan-ide" }
vilan-embedded-std = { path = "../vilan-embedded-std" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time"] }
dashmap = "6"
# Reading the client's feature settings (`initializationOptions` /
# `workspace/didChangeConfiguration`), which arrive as `serde_json::Value`.
# Already in the tree via tower-lsp — this only makes the edge direct.
serde_json = "1"

[dev-dependencies]
# `CLOCK_THREAD_CPUTIME_ID` for E122's scaling gate — backlog M15's clock, the
# same one `vilan-cli/tests/perf_baseline.rs` reads, because a wall-clock ratio
# is a claim about the server only on an idle machine. Already in the tree
# (vilan-cli depends on it), so the lockfile and the notices do not move.
libc = "0.2"

# The workspace clippy exception list (root Cargo.toml, backlog N21).
[lints]
workspace = true
