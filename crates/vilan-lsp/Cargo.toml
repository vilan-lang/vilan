[package]
name = "vilan-lsp"
version = "0.40.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vilan-lsp"
path = "src/main.rs"

[dependencies]
vilan-core = { path = "../vilan-core" }
# The completion engine, the line index, and the navigation primitives hover
# and definition read — shared with the playground (K9,
# proposal/playground-completion.md §3).
vilan-ide = { path = "../vilan-ide" }
vilan-embedded-std = { path = "../vilan-embedded-std" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time"] }
dashmap = "6"
# Reading the client's feature settings (`initializationOptions` /
# `workspace/didChangeConfiguration`), which arrive as `serde_json::Value`.
# Already in the tree via tower-lsp — this only makes the edge direct.
serde_json = "1"

# Test-only, and only for the clock: E121's keystroke-path gate
# (`src/keystroke.rs`'s `gate` module) asserts THREAD CPU time so that eleven
# sibling test suites cannot red it (backlog M15), and neither platform exposes
# a thread clock through `std`. Both packages are already in the lockfile — and
# so already covered by `THIRD-PARTY-NOTICES.txt` — because the tree depends on
# them elsewhere; these edges add no third-party surface to the shipped binary,
# which is why they are dev-dependencies and not dependencies. The identical
# pair on `vilan-cli` carries the same note for the same reason.
[target."cfg(unix)".dev-dependencies]
libc = "0.2"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The workspace clippy exception list (root Cargo.toml, backlog N21).
[lints]
workspace = true
