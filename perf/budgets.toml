# perf/budgets.toml — the performance ceilings (M105 S3; `performance-gates.md` §4, RULED Q5–Q7).
#
# Read and written by `scripts/perf_gate.py`. Nobody sets a ceiling by hand: the seal sets each one from a
# measurement (`perf_gate.py ratchet --from MEASURED.json`), and lowers it when a subject comes in more
# than 2% under. Judged CUMULATIVELY against the ceiling, never against the parent commit, with
# `tolerance` on top and every `[[bump]]` for the subject multiplied in.
#
# A row is a subject's `vilan check` on a release build, counted by `counter` (`instructions:u`, the
# hardware counter; `callgrind`, its Ir where there is no PMU) on machine `class` — counts are per ISA and
# per libc, so a ceiling binds only the class it was measured on (`reference` is the owner's 9800X3D,
# `ci` the GitHub runner's callgrind count, adopted from the CI `perf` job's own JSON by M114). A row may
# carry its own `tolerance` in place of the file's: the `ci` rows hold to 0.5% (Q7), because the job's
# count moved by under 0.01% across the four runner CPUs it met.
#
# A change that legitimately costs more adds, IN THE SAME COMMIT:
#   [[bump]]
#   subject = "genapp:46"
#   class = "reference"
#   ratio = 1.02
#   reason = "one sentence"
#   item = "Mnnn"
# The seal lists every bump since the release; the owner approves one over 3%, or any on kolt (Q6). A bump
# lives one release: the cut ABSORBS it (`ratchet --release --from <the seal's verdict>`, in the release
# commit) — the bumped row's ceiling becomes the count the seal measured, and the bump rows reset (N146).
#
# `[[growth]]` holds everywhere, whatever the class: the plain package of `small` and of `large` modules,
# measured in one run, may differ by at most `max_ratio` (≤ x2.3 per doubling, Q11; M107 met it in
# Order 46 at x1.94 from v0.43.0's x2.99).
#
# `[[e121]]` are the editor's targets (Q9) on the seal's LSP harness rows: each reports red until it has
# been green at two consecutive seals (`green_seals`), then `blocking` flips and it refuses (S8). The seals
# keep that count beside their verdicts (`e121-state.json`), never in this file mid-order; the release
# commit writes it here (N146). A row with `mandate = true` (leaf, css, parse break) must be MEASURED:
# when the harness skipped it (its anchors are missing in the source it replayed, N174) the seal is red;
# a skipped row without it is a note. A `series` string is printed under the report's E121 table: the
# row's anchors moved and its figures start a NEW series.
tolerance = 0.01

# Every subject the gate measures, whether or not this class has a ceiling for it yet.
subjects = [
    "example:math", "example:watch", "example:browser", "example:fullstack", "example:router",
    "example:reactive-ui", "example:ssr", "example:canvas", "example:rpc", "example:todo",
    "example:walkthrough", "genapp:46",
]

