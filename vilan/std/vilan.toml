# The Vilan standard library — a `[library]` that serves every platform by layering
# its source. Core modules live in the base `root` (`src`) and are available
# everywhere; platform modules live in `[library.layer.<name>]` overlays, each
# declaring the platforms it serves. A module resolves to the most-specific matching
# layer; importing an off-platform module (e.g. `std::dom` in a Node build) is a
# cross-platform error.
[library]
name = "std"
# std compiles with NO ambient scope (`prelude.md` §10.1). Three reasons, in
# order of weight: std's own resolution stays greppable — 741 top-level
# declarations across 63 files, every symbol somebody's lang item, and "where
# does this name come from" must be answerable by reading the file; the
# bootstrapping order becomes trivial rather than delicate, since the prelude's
# members are std definitions; and it exercises the `false` path in the one
# package every user of the language builds. Stated here rather than
# special-cased in the compiler, so a reader sees the posture and no "std is
# different" branch can drift.
#
# The census, refreshable from this directory — a declaration is a top-level
# `fun`/`external fun`/`struct`/`trait`/`enum`/`let`, which is the set
# `visibility.md` §6 counts. B318's marker sits AHEAD of the declaration, so the
# recipe takes an optional `export ` or it counts only what std keeps private:
#
#     grep -rhE '^(export )?(external fun|fun|struct|trait|enum|let) ' --include='*.vl' src | wc -l   # 741
#     find src -name '*.vl' | wc -l                                                                   # 63
#
# std is CURATED under B318 S6 (`visibility.md` §8: std curates from release N).
# Counting every declaration kind — the six above plus `async fun`,
# `external struct`, `resource struct` and `macro` — that is 856 declarations,
# 548 exported and 308 private; 33 of the 60 modules that declare anything
# export everything and carry the bare marker:
#
#     grep -rlE '^export \*;' --include='*.vl' src | wc -l                                  # 33
#
# 152 of the declarations are reached by name or by qualification from another
# std file — std's cross-file reach, and the FLOOR of the curated surface. That
# number is not a grep: it is what `check_plain_reaches` reports over a program
# importing every module, which is why it is exact where a grep would not be.
#
# std still CONTAINS the two prelude modules (`src/prelude.vl`, `src/web.vl`) —
# that is a fact about contents, not about resolution.
prelude = false

# The process-having runtimes (node today; deno/bun join `@process` when added).
# Its `node:`-compat bindings are portable across them, so no per-runtime split.
[library.layer.process]
platform = ["@process"]    # fs, http, process

[library.layer.browser]
platform = ["browser"]     # dom, ui, storage

# std's prose is re-filled by `vilan fmt` (E205's `wrap_comments`), to 84
# columns rather than to the 100 the printer lays CODE out to (E215's R1/R2).
# The width is std's own, measured over its 11,495 comment lines: the
# distribution's knee is at 79-80 and its 99th percentile is 82, so a fill to
# 100 would have rewritten every paragraph in the library to a margin nobody
# had chosen. This is the first package in the tree to opt in, and R3 holds
# `wrap_comments` off by default until std has run under it for one order.
[fmt]
wrap_comments = true
comment_width = 84
