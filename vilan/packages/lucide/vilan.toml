# Lucide's icons for `std::ui` (gfx-path.md S4, ruling R11: icon sets ship as
# generated packages outside std). A `[library]`: a program takes it by a path
# dependency and calls an icon by its name, `lucide::check()`.
#
# Everything under `src/icons` is GENERATED by `scripts/lucide-native.mjs` from
# the upstream SVG set (README.md says how and from which version), so it is the
# library's `generated` root: `vilan fmt` and the editor's reading aids leave it
# alone. `src/lib.vl` is written by hand.
#
# NATIVE ONLY: an icon is a `std::ui` value, and the JavaScript build refuses
# `std::ui` by name.
[library]
name = "lucide"
generated = "src/icons"
