# A list of 100,000 rows on `std::ui::kit`'s virtual list (native-ui.md part
# P4): the tree holds only the rows near the viewport, the scroll's range is
# the whole list's, and the rows are keyed, so a row that stays in view keeps
# its hover, press and focus. NATIVE ONLY — the JavaScript build refuses
# `std::ui` by name — so it is built with the Rust backend:
#
#   vilan run --backend rust .                           the window
#   vilan run --backend rust . -- --smoke                a line per frame
#   vilan run --backend rust . -- --check --font <ttf>   the tree without a window
#   vilan run --backend rust . -- --measure --font <ttf> its costs without a window
#
# The window needs a GPU adapter (any Vulkan, Metal, DirectX 12 or OpenGL
# driver, or Mesa's software Vulkan) and, on Linux, an X11 or Wayland session.
[package]
name = "ui_virtual_list"
root = "."
