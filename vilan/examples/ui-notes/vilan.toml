# A notes pad on `std::ui::kit`'s text area (native-ui.md part P5, text editing):
# a multi-line text bound to a signal — typing, line breaks, the caret moving by
# visual line, selection over lines, scrolling, undo — with every colour, radius
# and spacing supplied by the app, none by the kit. NATIVE ONLY — the JavaScript
# build refuses `std::ui` by name — so it is built with the Rust backend:
#
#   vilan run --backend rust .              the window
#   vilan run --backend rust . -- --check   the tree driven without a window
#
# It needs a GPU adapter (any Vulkan, Metal, DirectX 12 or OpenGL driver, or
# Mesa's software Vulkan) and, on Linux, an X11 or Wayland session. See the
# native guide's "Components" section.
[package]
name = "ui_notes"
root = "."
