# A browser client built on `std::reactive` + `std::ui`. `app.vl` is the entry;
# it mounts the `counter` and `todos` components. As a `browser`-target package,
# a plain `vilan build .` emits `app.js` (and the `const` styles' `app.css`) next
# to it — no `--target` needed. Sources sit at the package root, so `root` is `.`.
[package]
name = "reactive_ui"
root = "."
entry = "app.vl"
target = "browser"
