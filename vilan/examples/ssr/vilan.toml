# The server-side-rendering example (proposal/ssr.md, A7 — render and replace):
# ONE package, two entries. The browser client and the Node server build from
# the same source tree, so the one `fun app(): View` in `src/app.vl` is shared
# by construction. `import std::ui` resolves per ENTRY: the browser layer (live
# DOM) in the client leg, the process layer (an HTML string) in the server leg —
# the same source, no annotation. That per-leg shadow is the whole SSR mechanism
# (proposal/ssr.md §0): one component, two rendered forms.
#
# The server renders the view to an HTML string and splices it into its shell,
# so the page arrives fully painted (SEO, first paint); the client then builds
# the same view live and REPLACES the server markup on boot. No hydration —
# render, then replace.
#
#   vilan build .   compiles both entries into `dist/` (`client.js` / `server.js`)
#   vilan run .     builds both and starts the Node server → http://localhost:8791
[package]
name = "ssr"

[entry.client]
target = "browser"

[entry.server]
# target defaults to node; path defaults to server.vl under src/
